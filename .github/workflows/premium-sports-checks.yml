name: Premium sports Python integration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'sports_premium.py'
      - 'Dockerfile'
      - 'tests/test_premium_sports.py'
      - '.github/workflows/premium-sports-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sports-and-existing-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Verify Railway Dockerfile bundles the sports backend
        run: grep -Eq '^COPY .*sports_premium\\.py ./.*        run: python -m compileall -q server.py sports_premium.py
      - name: Test Premium sports and existing auth/device pairing
        run: PYTHONPATH=. python -m pytest -q tests/test_premium_sports.py tests/test_api.py tests/test_qr_pairing_v0910.py
 Dockerfile
      - name: Compile Python sources
        run: python -m compileall -q server.py sports_premium.py
      - name: Test Premium sports and existing auth/device pairing
        run: PYTHONPATH=. python -m pytest -q tests/test_premium_sports.py tests/test_api.py tests/test_qr_pairing_v0910.py
